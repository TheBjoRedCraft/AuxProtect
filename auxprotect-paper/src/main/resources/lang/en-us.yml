      header: '<target>''<optional_s> Playtime'
      hover: '<time>\n<minutes> online'
      nouser: 'No user specified'
      toomanyusers: 'Too many users specified'
      toolong: 'Max time range for playtime is <days> days.'
    invalid-time-parameter: 'Invalid time specifier: <specifier>'
    wrong-flag: 'You can''t use #<flag> with the table <table>'
  help:
    nohelp: 'This command does not have a help page.'
    header: '----- AuxProtect Help - /$prefix <command> -----'
    help:
      - '/$prefix lookup <params> - Perform a lookup'
      - '/$prefix purge <params> - Perform a database purge'
      - '/$prefix info - Version and credit information'
      - '/$prefix help [command] - Show this message, or more information on a subcommand'
      - ''
      - 'See the Wiki for more: https://github.com/Heliosares/AuxProtect/wiki'
    inventory:
      - '/$prefix inventory <name> [time]'
    lookup:
      - '/$prefix lookup <params>'
      - 'Params:'
      - 'Time: In seconds, minutes, hours, days, or weeks, represented by the first letter (i.e ''s'' for seconds).'
      - 'Before/After: Used to set a range for time lookup.'
      - 'Action: Type of world interaction log, see tab completion for options.'
      - 'Target: Specify the parameter an action was performed to. You can use an asterisk as a wildcard and a dash as a space in this parameter.'
      - 'Radius: Specify the square block radius for a lookup.'
      - 'All parameters can be inverted using ''!'' (i.e radius:5,!2 would do a lookup within 5 blocks of the player, but NOT within 2 blocks.)'
    playtime:
      - '/$prefix playtime <name> [time]'
    purge:
      - '/$prefix purge <table | all> <time>'
      - 'See tab completion for list of valid tables.'
      - 'Minimum time is 2 weeks.'
